<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#102327"><title>Steve The PC Repair Man — Dead Battery</title><meta name="description" content="An original first-person 3D repair and stealth adventure. An honest repair shop. A very different night shift."><link rel="icon" href="index.icon.png"><style>
@font-face{font-family:Workshop;src:url(workshop_ui.ttf) format("truetype")}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101c20;overflow:hidden;font-family:Workshop,sans-serif}#canvas{width:100%;height:100%;display:block;outline:0}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101c20;color:#e9e2cd;z-index:4}#boot .content{width:min(480px,80vw)}.eyebrow{font-size:12px;letter-spacing:.3em;color:#dc9c65;margin-bottom:24px}h1{font-size:clamp(50px,9vw,88px);margin:0;letter-spacing:-.05em;line-height:1}h2{font-size:18px;letter-spacing:.24em;font-weight:400;margin:12px 0 48px}.bar{height:2px;background:#33474b}.bar i{display:block;height:100%;background:#e4a46e;width:0;transition:width .3s}#status{font-size:12px;letter-spacing:.06em;margin-top:16px;color:#94a7a3}.note{position:absolute;bottom:30px;font-size:11px;color:#718783;letter-spacing:.16em}#fail{display:none;color:#ffb788;line-height:1.7;margin-top:24px}button{background:#e4a46e;border:0;color:#101c20;padding:14px 20px;cursor:pointer;font:inherit}
</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0" aria-label="Steve The PC Repair Man 3D game"></canvas><div id="boot"><div class="content"><div class="eyebrow">CASE 01 / FIRST PERSON</div><h1>STEVE</h1><h2>THE PC REPAIR MAN</h2><div class="bar"><i id="progress"></i></div><div id="status">Opening the shop…</div><div id="fail"></div></div><div class="note">EVERYTHING HAS A FIX.</div></div><script src="$GODOT_URL"></script><script>
const GAME_CONFIG=$GODOT_CONFIG;GAME_CONFIG.mainPack='first-person.pck';GAME_CONFIG.args=['--main-pack',GAME_CONFIG.mainPack,...GAME_CONFIG.args];const packSize=GAME_CONFIG.fileSizes['index.pck'],wasmSize=GAME_CONFIG.fileSizes['index.wasm'];delete GAME_CONFIG.fileSizes['index.pck'];let packLoaded=0,engineLoaded=0,loaded=false;
function progress(){const percent=Math.min(100,100*(packLoaded+engineLoaded)/(packSize+wasmSize));document.querySelector('#progress').style.width=percent+'%';document.querySelector('#status').textContent='Opening the shop… '+Math.floor(percent)+'%';}
GAME_CONFIG.onProgress=(c)=>{engineLoaded=Math.min(wasmSize,c);progress();};const engine=new Engine(GAME_CONFIG);window.STEVE_VOICES='Original generated performances';
async function loadPack(){const response=await fetch('first-person-pack.json',{cache:'no-cache'});if(!response.ok)throw new Error('Game download is unavailable.');const manifest=await response.json();const bytes=new Uint8Array(manifest.size);await Promise.all(manifest.parts.map(async(part)=>{const response=await fetch(part.url);if(!response.ok)throw new Error('Game download was interrupted.');const reader=response.body.getReader();let count=0;for(;;){const result=await reader.read();if(result.done)break;if(count+result.value.length>part.size)throw new Error('Game download is incomplete.');bytes.set(result.value,part.offset+count);count+=result.value.length;packLoaded+=result.value.length;progress();}if(count!==part.size)throw new Error('Game download is incomplete.');}));await engine.preloadFile(bytes,GAME_CONFIG.mainPack);}
Promise.all([engine.init(GAME_CONFIG.executable),loadPack()]).then(()=>{document.querySelector('#status').textContent='Turning on the lights…';return engine.start();}).then(()=>{loaded=true;document.querySelector('#boot').style.display='none';document.querySelector('#canvas').focus();}).catch(err=>{document.querySelector('#status').textContent='The shop couldn’t open on this browser.';let f=document.querySelector('#fail');f.style.display='block';f.textContent='Try a recent Chrome, Firefox, Safari, or Edge with WebGL enabled. '+err.message;});
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden&&loaded){document.exitPointerLock?.();}});
</script></body></html>
